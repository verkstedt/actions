name: 'Docker Build and Push: Setup GitHub Container Registry'
on:
  workflow_call:
    secrets:
      GITHUB_TOKEN:
        description: >
          GitHub Token with permissions to write to GitHub Container Registry.
        required: true
    inputs:
      image-name:
        description: >
          Image name.
          Leave empty to use repository name.
        type: string
        default: ''

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      registry: ${{ steps.setup.outputs.registry }}
      image-name: ${{ steps.setup.outputs.image-name }}
      url: ${{ steps.setup.outputs.url }}
    steps:
      - name: 'Validate inputs'
        id: setup
        run: |
          registry="ghcr.io/${{ github.repository_owner }}"
          echo "registry=$registry" | tee -a "$GITHUB_OUTPUT"

          image_name="${{ inputs.image-name }}"
          if [ -z "$image_name" ]
          then
            image_name="${{ github.event.repository.name }}"
          fi
          echo "image-name=$image_name" | tee -a "$GITHUB_OUTPUT"

          echo "url=${registry}/$image_name" | tee -a "$GITHUB_OUTPUT"

      - name: 'Authenticate'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
