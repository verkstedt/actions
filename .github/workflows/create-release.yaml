# Create Release
#
# Template to use with this workflow:
# https://github.com/verkstedt/.github/tree/main/workflow-templates/create-release.yaml
#
# - Bump the version up (`package.json` and — if it exists — `version.txt`)
# - Add release notes in `CHANGELOG.md`
# - Commit and push
# - Create git version tag
# - Create GitHub release
# - Send slack notification
#
# Requires `CREATE_RELEASE_APP_ID` variable and
# `CREATE_RELEASE_APP_PRIVATE_KEY` secret. Convinient to set it at
# organisation level.

name: Create Release

on:
  workflow_call:
    inputs:
      release-type:
        description: 'Type of release (major, minor, patch, or prerelease)'
        type: string
        default: 'patch'
      dry-run:
        description: 'Dry–run'
        type: boolean
        default: false

jobs:
  release:
    name: 'Create Release'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Verify inputs
        run: |
          if ! echo "${{ inputs.release-type }}" | grep -qE '^(major|minor|patch|prerelease)$'
          then
            echo "::error::Invalid release-type: ${{ inputs.release-type }}. Must be one of: major, minor, patch, prerelease."
            exit 64 # EX_USAGE
          fi

          if [ "${{ inputs.release-type }}" = "prerelease" ]
          then
            echo "::error::Prerelease not supported (yet)."
            exit 64 # EX_USAGE
          fi

      - name: Set environment variables
        env:
          ENV_VARS: ${{ secrets.env_vars }}
        run: |
          echo "$ENV_VARS" >> "$GITHUB_ENV"

      - name: 'GitHub App token: Obtain token'
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CREATE_RELEASE_APP_ID }}
          private-key: ${{ secrets.CREATE_RELEASE_APP_PRIVATE_KEY }}

      - name: 'GitHub App token: Get User ID'
        id: app-token-data
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          user_id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)
          echo "user-id=$user_id" >> "$GITHUB_OUTPUT"

      - name: Setup
        id: setup
        uses: verkstedt/actions/setup@v1
        with:
          token: ${{ steps.app-token.outputs.token }}
          github-npm-registry-personal-access-token: ${{ secrets.GH_NPM_REGISTRY_PERSONAL_ACCESS_TOKEN }}

      - name: Release
        env:
          # Note: This script doesn’t access steps.*.outputs and
          # inputs.* directly to make it easier to copy it to separate
          # file for testing
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          PACKAGE_MANAGER: ${{ steps.setup.outputs.package-manager }}
          RELEASE_TYPE: ${{ inputs.release-type }}
        run: |
          echo "::group::Prepare semantic-release configuration"
          release_config_mjs="$( mktemp --suffix=.mjs )"
          cat > "$release_config_mjs" << 'RELEASE_CONFIG_MJS_EOF'

          /**
          * @type {import('semantic-release').GlobalConfig}
          */
          export default {
            plugins: [
              ["@semantic-release/exec", {
                // Do not analyse commits to determine release type
                analyzeCommitsCmd: `echo ${process.env.RELEASE_TYPE}`,
                // Update version.txt, if exists
                prepareCmd: 'if [ -f version.txt ]; then echo "${nextRelease.version}" > version.txt; fi',
                // Use GitHub API to generate release notes
                generateNotesCmd: `
                  gh api \
                    -X POST \
                    repos/:owner/:repo/releases/generate-notes \
                    -f tag_name='\${nextRelease.gitTag}' \
                    -f previous_tag_name='\${lastRelease.gitTag}' \
                    --jq '"# " + .name + "\n\n" + .body'
                `,
                // Write release notes to GitHub Actions summary
                successCmd: `cat << 'STEP_SUMMARY' >> ${process.env.GITHUB_STEP_SUMMARY}\n\${nextRelease.notes}\nSTEP_SUMMARY`,
              }],
              // Update version package.json, do not publish to npm registry
              ['@semantic-release/npm', {
                npmPublish: false
              }],
              // Write changelog
              ['@semantic-release/changelog'],
              // Commit and push changed files
              ['@semantic-release/git', {
                assets: ['CHANGELOG.md', 'package.json', 'package-lock.json', 'version.txt'],
                message: [
                  'chore(release): ${nextRelease.version}',
                  '${nextRelease.notes}',
              ].join('\n\n'),
              }],
              // Register a GitHub release
              ['@semantic-release/github'],
            ]
          }
          RELEASE_CONFIG_MJS_EOF
          echo "::endgroup::"

          # Clean up
          trap 'rm -fv "$release_config_mjs"' EXIT INT TERM

          echo "::group::Install semantic-release plugins"
          npm_pkg_args=$(
            node --input-type=module --eval "
              const { default: config } = await import(process.argv[1], { assert: { type: 'module' } });
              process.stdout.write(
                config.plugins
                  .map(p => Array.isArray(p) ? p[0] : p)
                  .filter(p => ! /^(\\.\\/|\\.\\.\\/|\/)/.test(p))
                  .join('\\n')
              );
            " "$release_config_mjs" |
              # Skip plugins bundled with semantic-release
              # https://semantic-release.gitbook.io/semantic-release/usage/plugins#default-plugins
              # Docs also list @semantic-release/npm, but it doesn’t seem true
              grep -vE '@semantic-release/commit-analyzer|@semantic-release/release-notes-generator|@semantic-release/github'
          )

          if [ -n "$npm_pkg_args" ]
          then
            case "$PACKAGE_MANAGER" in
              yarn)
                # shellcheck disable=SC2086
                yarn add -D $npm_pkg_args
                ;;
              npm)
                # shellcheck disable=SC2086
                npm install -D $npm_pkg_args
                ;;
              *)
                echo "::error::Unsupported package manager: $PACKAGE_MANAGER"
                exit 69 # EX_UNAVAILABLE
                ;;
            esac

            git restore package.json || :
            git restore package-lock.json || :
            git restore yarn.lock || :
          fi
          echo "::endgroup::"

          # Use our GitHub app bot as author of the release commit
          GIT_AUTHOR_NAME='${{ steps.app-token.outputs.app-slug }}[bot]'
          GIT_AUTHOR_EMAIL='${{ steps.app-token-data.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'
          export GIT_AUTHOR_NAME GIT_AUTHOR_EMAIL

          # Not really semantically true, because semanit-release is
          # both the author and commiter, but with this we’ll have a
          # nice info in git of who triggered the release
          GIT_COMMITTER_NAME="$GITHUB_ACTOR"
          GIT_COMMITTER_EMAIL="$GITHUB_ACTOR_ID+$GITHUB_ACTOR@users.noreply.github.com"
          export GIT_COMMITTER_NAME GIT_COMMITTER_EMAIL

          echo "::group::Run semantic-release"
          if [ "${{ inputs.dry-run }}" = "true" ]
          then
            set -- "$@" --dry-run
          fi
          npx --yes semantic-release --extends "$release_config_mjs" "$@"
          echo "::endgroup::"

      - name: Notify
        if: inputs.dry-run != true
        uses: verkstedt/actions/notify-status@v1
        with:
          status: success
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          slack-channel-id: ${{ vars.SLACK_CHANNEL_ID }}
