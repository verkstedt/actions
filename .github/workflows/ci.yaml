name: 'CI'

on:
  workflow_call:
    inputs:
      working-directory:
        description: >
          Directory in which to run things in.
        type: string
        required: false
        default: '.'
      browsers:
        description: >
          Whitespace–separated list of Playwright browsers to install
          before running unit tests (e.g. `chromium firefox`).

          Leave at `auto` to detect them from the vitest config, or set
          to an empty string to skip installing browsers altogether.
        type: string
        required: false
        default: 'auto'
    secrets:
      env_vars:
        description: >
          Environment variables to set when running npm scripts.
        required: false
      build_env:
        description: >
          (DEPRECATED! Use env_vars instead)
          Environment variables to set when running build script.
        required: false
      GH_AUTH_APP_SECRET:
        description: >
          GitHub App private key for generating tokens.
          Used in pair with vars.GH_AUTH_APP_ID — set both or neither.
        required: false
      GH_NPM_REGISTRY_PERSONAL_ACCESS_TOKEN:
        description: >
          GitHub personal access token for npm registry authentication.
          You can create one at https://github.com/settings/tokens/new
          (scopes: `read:packages`, `repo` and `read:org`). If not set,
          will use secrets.GITHUB_TOKEN, which is enough for most cases.
        required: false
      SLACK_BOT_TOKEN:
        description: >
          Slack bot token, used by check-licenses to notify about
          failures on main branch. Go to https://api.slack.com/apps/,
          create a bot, go to “OAuth & Permissions”. Add chat:write
          permission and grab a token.
        required: false

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  # Each job here will use verkstedt/action/setup which checks out the
  # code and runs `npm install`, caching the results.
  # We run this job with just `setup` before anything else to make sure
  # that cache is filled up for all other jobs.
  initial-setup:
    name: 'Initial setup'
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event.pull_request.draft == false
    outputs:
      scripts: ${{ steps.setup.outputs.scripts }}
    steps:
      - name: Set environment variables
        env:
          ENV_VARS: ${{ secrets.env_vars }}
        run: |
          echo "$ENV_VARS" >> "$GITHUB_ENV"

      - name: GitHub App token
        id: app-token
        uses: verkstedt/actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.GH_AUTH_APP_ID }}
          private-key: ${{ secrets.GH_AUTH_APP_SECRET }}

      - name: Setup
        id: setup
        uses: verkstedt/actions/setup@v1
        with:
          working-directory: ${{ inputs.working-directory }}
          token: ${{ steps.app-token.outputs.token }}
          github-npm-registry-personal-access-token: ${{ secrets.GH_NPM_REGISTRY_PERSONAL_ACCESS_TOKEN }}

  lint-js:
    name: 'Lint JS'
    runs-on: ubuntu-latest
    if: contains(needs.initial-setup.outputs.scripts, ',lint:js,')
    needs:
      - initial-setup
    env:
      ESLINT_REPORT_JSON: '${{ inputs.working-directory }}/eslint_report.json'
    steps:
      - name: Set environment variables
        env:
          ENV_VARS: ${{ secrets.env_vars }}
        run: |
          echo "$ENV_VARS" >> "$GITHUB_ENV"

      - name: GitHub App token
        id: app-token
        uses: verkstedt/actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.GH_AUTH_APP_ID }}
          private-key: ${{ secrets.GH_AUTH_APP_SECRET }}

      - name: Setup
        uses: verkstedt/actions/setup@v1
        with:
          working-directory: ${{ inputs.working-directory }}
          token: ${{ steps.app-token.outputs.token }}
          github-npm-registry-personal-access-token: ${{ secrets.GH_NPM_REGISTRY_PERSONAL_ACCESS_TOKEN }}

      # Once https://github.com/actions/setup-node/issues/96 is
      # implemented, next two steps can be replaced with just:
      #
      # - name: Lint JS
      #   run: npm lint:js

      - name: Lint JS
        id: lint
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -- npm run lint:js

          npm_script=$( jq -r '.scripts["lint:js"]' package.json )
          if echo "$npm_script" | grep -qE '(eslint|next lint)'
          then
            if echo "$npm_script" | grep -qE '\<(eslint|next lint)\>([^;&|]*)($|"\$@")'
            then
              set -- "$@" -- --format=json --output-file=${{ env.ESLINT_REPORT_JSON }}
            else
              echo "::warning::lint:js script seems to be using eslint in a way that doesn’t pass arguments to it. Please fix that. e.g. \`eslint .\` or \`sh -c 'eslint . \"\$@\" && echo OK' _\`"
            fi
          fi

          set +e
          "$@"
          exit_code=$?
          set -e

          if [ -s "${ESLINT_REPORT_JSON}" ]
          then
            echo "generated-eslint-report=true" >> "$GITHUB_OUTPUT"
          else
            echo "generated-eslint-report=false" >> "$GITHUB_OUTPUT"
          fi

          exit "$exit_code"

      - name: Annotate
        # Using always(), because we want this step to run even if (or
        # rather: especially if) linting fails, so that lint errors are
        # visible in the PR.
        if: always() && steps.lint.outputs.generated-eslint-report == 'true'
        uses: ataylorme/eslint-annotate-action@3.0.0
        with:
          report-json: ${{ env.ESLINT_REPORT_JSON }}
          # Also report errors in files not changed in the PR,
          # assuring there are no errors in the whole codebase
          only-pr-files: false

  lint-ts:
    name: 'Lint TS'
    runs-on: ubuntu-latest
    if: contains(needs.initial-setup.outputs.scripts, ',lint:ts,')
    needs:
      - initial-setup
    steps:
      - name: Set environment variables
        env:
          ENV_VARS: ${{ secrets.env_vars }}
        run: |
          echo "$ENV_VARS" >> "$GITHUB_ENV"

      - name: GitHub App token
        id: app-token
        uses: verkstedt/actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.GH_AUTH_APP_ID }}
          private-key: ${{ secrets.GH_AUTH_APP_SECRET }}

      - name: Setup
        uses: verkstedt/actions/setup@v1
        with:
          working-directory: ${{ inputs.working-directory }}
          token: ${{ steps.app-token.outputs.token }}
          github-npm-registry-personal-access-token: ${{ secrets.GH_NPM_REGISTRY_PERSONAL_ACCESS_TOKEN }}

      - name: Lint TS
        working-directory: ${{ inputs.working-directory }}
        run: npm run lint:ts

  lint-css:
    name: 'Lint CSS'
    runs-on: ubuntu-latest
    if: contains(needs.initial-setup.outputs.scripts, ',lint:css,')
    needs:
      - initial-setup
    steps:
      - name: Set environment variables
        env:
          ENV_VARS: ${{ secrets.env_vars }}
        run: |
          echo "$ENV_VARS" >> "$GITHUB_ENV"

      - name: GitHub App token
        id: app-token
        uses: verkstedt/actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.GH_AUTH_APP_ID }}
          private-key: ${{ secrets.GH_AUTH_APP_SECRET }}

      - name: Setup
        uses: verkstedt/actions/setup@v1
        with:
          working-directory: ${{ inputs.working-directory }}
          token: ${{ steps.app-token.outputs.token }}
          github-npm-registry-personal-access-token: ${{ secrets.GH_NPM_REGISTRY_PERSONAL_ACCESS_TOKEN }}

      - name: Lint CSS
        working-directory: ${{ inputs.working-directory }}
        run: |
          npm run lint:css

  lint-sh:
    name: 'Lint shell scripts'
    runs-on: ubuntu-latest
    if: contains(needs.initial-setup.outputs.scripts, ',lint:sh,')
    needs:
      - initial-setup
    steps:
      - name: Set environment variables
        env:
          ENV_VARS: ${{ secrets.env_vars }}
        run: |
          echo "$ENV_VARS" >> "$GITHUB_ENV"

      - name: GitHub App token
        id: app-token
        uses: verkstedt/actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.GH_AUTH_APP_ID }}
          private-key: ${{ secrets.GH_AUTH_APP_SECRET }}

      - name: Setup
        uses: verkstedt/actions/setup@v1
        with:
          working-directory: ${{ inputs.working-directory }}
          token: ${{ steps.app-token.outputs.token }}
          github-npm-registry-personal-access-token: ${{ secrets.GH_NPM_REGISTRY_PERSONAL_ACCESS_TOKEN }}

      - name: Lint shell scripts
        working-directory: ${{ inputs.working-directory }}
        run: |
          npm run lint:sh

  lint-missing-translations:
    name: 'Lint missing translations'
    runs-on: ubuntu-latest
    if: contains(needs.initial-setup.outputs.scripts, ',lint:missing-translations,')
    needs:
      - initial-setup
    steps:
      - name: Set environment variables
        env:
          ENV_VARS: ${{ secrets.env_vars }}
        run: |
          echo "$ENV_VARS" >> "$GITHUB_ENV"

      - name: GitHub App token
        id: app-token
        uses: verkstedt/actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.GH_AUTH_APP_ID }}
          private-key: ${{ secrets.GH_AUTH_APP_SECRET }}

      - name: Setup
        uses: verkstedt/actions/setup@v1
        with:
          working-directory: ${{ inputs.working-directory }}
          token: ${{ steps.app-token.outputs.token }}
          github-npm-registry-personal-access-token: ${{ secrets.GH_NPM_REGISTRY_PERSONAL_ACCESS_TOKEN }}

      - name: Lint Translations
        working-directory: ${{ inputs.working-directory }}
        run: npm run lint:missing-translations

  check-licenses:
    name: 'Check licenses'
    runs-on: ubuntu-latest
    if: vars.CHECK_LICENSES == 'true'
    needs:
      - initial-setup
    steps:
      - name: Set environment variables
        env:
          ENV_VARS: ${{ secrets.env_vars }}
        run: |
          echo "$ENV_VARS" >> "$GITHUB_ENV"

      - name: GitHub App token
        id: app-token
        uses: verkstedt/actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.GH_AUTH_APP_ID }}
          private-key: ${{ secrets.GH_AUTH_APP_SECRET }}

      - name: Setup
        uses: verkstedt/actions/setup@v1
        with:
          working-directory: ${{ inputs.working-directory }}
          token: ${{ steps.app-token.outputs.token }}
          github-npm-registry-personal-access-token: ${{ secrets.GH_NPM_REGISTRY_PERSONAL_ACCESS_TOKEN }}

      - name: Check licenses
        id: check
        working-directory: ${{ inputs.working-directory }}
        shell: bash
        env:
          LICENSE_CHECK_ALLOW_LICENSES_GLOBAL: ${{ vars.LICENSE_CHECK_ALLOW_LICENSES_GLOBAL }}
          LICENSE_CHECK_ALLOW_LICENSES: ${{ vars.LICENSE_CHECK_ALLOW_LICENSES }}
          LICENSE_CHECK_ALLOW_LICENSES_DEV_GLOBAL: ${{ vars.LICENSE_CHECK_ALLOW_LICENSES_DEV_GLOBAL }}
          LICENSE_CHECK_ALLOW_LICENSES_DEV: ${{ vars.LICENSE_CHECK_ALLOW_LICENSES_DEV }}
          LICENSE_CHECK_EXCLUDE_PACKAGES_GLOBAL: ${{ vars.LICENSE_CHECK_EXCLUDE_PACKAGES_GLOBAL }}
          LICENSE_CHECK_EXCLUDE_PACKAGES: ${{ vars.LICENSE_CHECK_EXCLUDE_PACKAGES }}
          LICENSE_CHECK_EXCLUDE_PACKAGES_DEV_GLOBAL: ${{ vars.LICENSE_CHECK_EXCLUDE_PACKAGES_DEV_GLOBAL }}
          LICENSE_CHECK_EXCLUDE_PACKAGES_DEV: ${{ vars.LICENSE_CHECK_EXCLUDE_PACKAGES_DEV }}
          LICENSE_CHECK_CLARIFICATIONS: ${{ vars.LICENSE_CHECK_CLARIFICATIONS }}
        run: |
          output_file=$(mktemp)
          trap 'rm -f "$output_file"' EXIT

          package='@verkstedt/check-licenses'
          # In the check-licenses repo itself npx would resolve the
          # package name to the local workspace, whose bin is never
          # linked into its own node_modules/.bin — run the local
          # package via a path instead. Bonus: it checks the code
          # under test.
          if [ "$( jq -r '.name' package.json )" = "$package" ]
          then
            package='.'
          fi

          set +e
          npx --yes "$package" \
            --allow-licenses="$LICENSE_CHECK_ALLOW_LICENSES_GLOBAL" \
            --allow-licenses="$LICENSE_CHECK_ALLOW_LICENSES" \
            --allow-licenses-dev="$LICENSE_CHECK_ALLOW_LICENSES_DEV_GLOBAL" \
            --allow-licenses-dev="$LICENSE_CHECK_ALLOW_LICENSES_DEV" \
            --exclude-packages="$LICENSE_CHECK_EXCLUDE_PACKAGES_GLOBAL" \
            --exclude-packages="$LICENSE_CHECK_EXCLUDE_PACKAGES" \
            --exclude-packages-dev="$LICENSE_CHECK_EXCLUDE_PACKAGES_DEV_GLOBAL" \
            --exclude-packages-dev="$LICENSE_CHECK_EXCLUDE_PACKAGES_DEV" \
            --clarifications="$LICENSE_CHECK_CLARIFICATIONS" \
            . 2>&1 | tee "$output_file"
          exit_code=${PIPESTATUS[0]}
          set -e

          {
            echo "output<<CHECK_LICENSES_EOF"
            cat "$output_file"
            echo "CHECK_LICENSES_EOF"
          } >> "$GITHUB_OUTPUT"

          exit "$exit_code"

      - name: Notify about violations
        if: >
          failure()
          && (
            github.ref == 'refs/heads/main'
            || github.ref == 'refs/heads/production'
            || startsWith(github.ref, 'refs/tags/v')
          )
        uses: verkstedt/actions/notify-status@v1
        with:
          status: warning
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          slack-channel-id: ${{ vars.LICENSE_VIOLATIONS_SLACK_CHANNEL_ID }}
          text: |
            ${{ steps.check.outputs.output }}

  # We prefer to have lint script split into lint:*, but will use
  # generic lint if no lint:* scripts are found
  lint-fallback:
    name: 'Lint fallback'
    runs-on: ubuntu-latest
    if: >
      contains(needs.initial-setup.outputs.scripts, ',lint,')
      && ! contains(needs.initial-setup.outputs.scripts, ',lint:')
    needs:
      - initial-setup
    steps:
      - name: Set environment variables
        env:
          ENV_VARS: ${{ secrets.env_vars }}
        run: |
          echo "$ENV_VARS" >> "$GITHUB_ENV"

      - name: GitHub App token
        id: app-token
        uses: verkstedt/actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.GH_AUTH_APP_ID }}
          private-key: ${{ secrets.GH_AUTH_APP_SECRET }}

      - name: Setup
        uses: verkstedt/actions/setup@v1
        with:
          working-directory: ${{ inputs.working-directory }}
          token: ${{ steps.app-token.outputs.token }}
          github-npm-registry-personal-access-token: ${{ secrets.GH_NPM_REGISTRY_PERSONAL_ACCESS_TOKEN }}

      - name: Lint fallback
        working-directory: ${{ inputs.working-directory }}
        run: npm run lint

  test-unit:
    name: 'Unit tests'
    runs-on: ubuntu-latest
    if: >
      '# Don’t skip if any of the needs (apart from initial-setup) are skipped'
      && !cancelled()
      && needs.initial-setup.result != 'skipped'
      && ! contains(needs.*.result, 'failure')
      && contains(needs.initial-setup.outputs.scripts, ',test:unit,')
    needs:
      - initial-setup
      - lint-js
      - lint-ts
      - lint-fallback
    steps:
      - name: Set environment variables
        env:
          ENV_VARS: ${{ secrets.env_vars }}
        run: |
          echo "$ENV_VARS" >> "$GITHUB_ENV"

      - name: GitHub App token
        id: app-token
        uses: verkstedt/actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.GH_AUTH_APP_ID }}
          private-key: ${{ secrets.GH_AUTH_APP_SECRET }}

      - name: Setup
        uses: verkstedt/actions/setup@v1
        with:
          working-directory: ${{ inputs.working-directory }}
          token: ${{ steps.app-token.outputs.token }}
          github-npm-registry-personal-access-token: ${{ secrets.GH_NPM_REGISTRY_PERSONAL_ACCESS_TOKEN }}

      - name: Determine browsers to install
        id: browsers
        uses: actions/github-script@v9.0.0
        env:
          INPUT_BROWSERS: ${{ inputs.browsers }}
        with:
          script: |
            const input = process.env.INPUT_BROWSERS.trim();
            if (input !== 'auto') {
              core.setOutput('browsers', input);
            } else {
              const { resolve } = await import('node:path');
              const { existsSync, globSync } = await import('node:fs');
              const fileName = globSync(resolve(
                '${{ github.workspace }}',
                '${{ inputs.working-directory }}',
                './vitest.config.*',
              )).at(0)

              if (fileName) {
                let vitestConfig;
                // We don’t know if vitest config is CJS or ESM. Try both.
                try {
                  vitestConfig = await import(fileName);
                } catch {
                  vitestConfig = require(fileName);
                }
                vitestConfig = vitestConfig?.default || vitestConfig;
                const browsers = new Set(
                  vitestConfig.test?.projects
                    ?.filter(proj => proj.test?.browser?.enabled)
                    .filter(proj => {
                      const provider = proj.test?.browser?.provider;
                      return (
                        provider == undefined
                        || provider === 'playwright'
                        || provider?.name === 'playwright'
                      )
                    })
                    .flatMap(proj => proj.test?.browser?.instances ?? [{ browser: 'chromium' }])
                    .filter(Boolean)
                    .map(instance => instance?.browser)
                );
                console.log('Needed browsers:', browsers);
                core.setOutput('browsers', Array.from(browsers).join(' '));
              }
            }

      - name: Install browsers (with system deps)
        if: steps.browsers.outputs.browsers != ''
        working-directory: ${{ inputs.working-directory }}
        env:
          BROWSERS: ${{ steps.browsers.outputs.browsers }}
        run: |
          # Word splitting is intentional (it’s a list), globbing is not.
          set -f
          # shellcheck disable=SC2086 # intentional word splitting
          npx playwright install --with-deps $BROWSERS
      - name: Test units
        working-directory: ${{ inputs.working-directory }}
        run: npm run test:unit

  test-end-to-end:
    name: 'End to end tests'
    runs-on: ubuntu-latest
    if: >
      '# Don’t skip if any of the needs (apart from initial-setup) are skipped'
      && !cancelled()
      && needs.initial-setup.result != 'skipped'
      && ! contains(needs.*.result, 'failure')
      && contains(needs.initial-setup.outputs.scripts, ',test:end-to-end,')
    needs:
      - initial-setup
      - build
    steps:
      - name: Set environment variables
        env:
          ENV_VARS: ${{ secrets.env_vars }}
        run: |
          echo "$ENV_VARS" >> "$GITHUB_ENV"

      - name: GitHub App token
        id: app-token
        uses: verkstedt/actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.GH_AUTH_APP_ID }}
          private-key: ${{ secrets.GH_AUTH_APP_SECRET }}

      - name: Setup
        uses: verkstedt/actions/setup@v1
        with:
          working-directory: ${{ inputs.working-directory }}
          token: ${{ steps.app-token.outputs.token }}
          github-npm-registry-personal-access-token: ${{ secrets.GH_NPM_REGISTRY_PERSONAL_ACCESS_TOKEN }}

      - name: Test end to end
        working-directory: ${{ inputs.working-directory }}
        run: npm run test:end-to-end

  # We prefer to have test script split into test:*, but will use
  # generic test if no test:* scripts are found
  test-fallback:
    name: 'Test fallback'
    runs-on: ubuntu-latest
    if: >
      '# Don’t skip if any of the needs (apart from initial-setup) are skipped'
      && !cancelled()
      && needs.initial-setup.result != 'skipped'
      && ! contains(needs.*.result, 'failure')
      && contains(needs.initial-setup.outputs.scripts, ',test,')
      && ! contains(needs.initial-setup.outputs.scripts, ',test:')
    needs:
      - initial-setup
      - lint-js
      - lint-ts
      - lint-fallback
    steps:
      - name: Set environment variables
        env:
          ENV_VARS: ${{ secrets.env_vars }}
        run: |
          echo "$ENV_VARS" >> "$GITHUB_ENV"

      - name: GitHub App token
        id: app-token
        uses: verkstedt/actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.GH_AUTH_APP_ID }}
          private-key: ${{ secrets.GH_AUTH_APP_SECRET }}

      - name: Setup
        uses: verkstedt/actions/setup@v1
        with:
          working-directory: ${{ inputs.working-directory }}
          token: ${{ steps.app-token.outputs.token }}
          github-npm-registry-personal-access-token: ${{ secrets.GH_NPM_REGISTRY_PERSONAL_ACCESS_TOKEN }}

      - name: Test fallback
        working-directory: ${{ inputs.working-directory }}
        run: npm run test

  build:
    name: 'Build'
    runs-on: ubuntu-latest
    if: >
      '# Don’t skip if any of the needs (apart from initial-setup) are skipped'
      && !cancelled()
      && needs.initial-setup.result != 'skipped'
      && ! contains(needs.*.result, 'failure')
      && contains(needs.initial-setup.outputs.scripts, ',build,')
    needs:
      - initial-setup
      # all linters:
      - lint-js
      - lint-ts
      - lint-css
      - lint-sh
      - lint-missing-translations
      - lint-fallback
      # all testers:
      - test-unit
      - test-fallback
    steps:
      - name: Set environment variables (build_env)
        run: |
          if [ -n "${{ secrets.build_env }}" ]
          then
            echo "::warning::build_env secret is deprecated, use env_vars instead."
            echo "${{ secrets.build_env }}" >> "$GITHUB_ENV"
          fi

      - name: Set environment variables
        env:
          ENV_VARS: ${{ secrets.env_vars }}
        run: |
          echo "$ENV_VARS" >> "$GITHUB_ENV"

      - name: GitHub App token
        id: app-token
        uses: verkstedt/actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.GH_AUTH_APP_ID }}
          private-key: ${{ secrets.GH_AUTH_APP_SECRET }}

      - name: Setup
        uses: verkstedt/actions/setup@v1
        with:
          lfs: true
          working-directory: ${{ inputs.working-directory }}
          token: ${{ steps.app-token.outputs.token }}
          github-npm-registry-personal-access-token: ${{ secrets.GH_NPM_REGISTRY_PERSONAL_ACCESS_TOKEN }}

      - name: Calculate cache key parts
        id: cache-keys
        uses: verkstedt/actions/cache-keys@v1
        with:
          working-directory: ${{ inputs.working-directory }}

      - name: Restore cache
        id: cache
        uses: actions/cache/restore@v6.1.0
        # ⚠ Keep in sync with cache/save below
        with:
          path: |
            ${{ inputs.working-directory }}/.next/cache
          key: |
            build--${{ steps.cache-keys.outputs.os }}--${{ steps.cache-keys.outputs.node }}--${{ steps.cache-keys.outputs.packageJson }}--${{ steps.cache-keys.outputs.packageJsonLock }}--${{ steps.cache-keys.outputs.ref }}
          restore-keys: |
            build--${{ steps.cache-keys.outputs.os }}--${{ steps.cache-keys.outputs.node }}--${{ steps.cache-keys.outputs.packageJson }}--${{ steps.cache-keys.outputs.packageJsonLock }}--
            build--${{ steps.cache-keys.outputs.os }}--${{ steps.cache-keys.outputs.node }}--${{ steps.cache-keys.outputs.packageJson }}--
            build--${{ steps.cache-keys.outputs.os }}--${{ steps.cache-keys.outputs.node }}--
            build--${{ steps.cache-keys.outputs.os }}--

      - name: Build
        working-directory: ${{ inputs.working-directory }}
        run: npm run build

      - name: Save cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        # ⚠ Keep in sync with cache/restore above
        with:
          path: |
            ${{ inputs.working-directory }}/.next/cache
          key: |
            build--${{ steps.cache-keys.outputs.os }}--${{ steps.cache-keys.outputs.node }}--${{ steps.cache-keys.outputs.packageJson }}--${{ steps.cache-keys.outputs.packageJsonLock }}--${{ steps.cache-keys.outputs.ref }}
