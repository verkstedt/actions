# Docker Build and Push to multiple registries
#
# Will tag the image with:
# - sha of the commit (`git-<short_sha>`)
# - if pushed to main branch:
#   - `edge`
# - if triggered by version tag push:
#   - `v<new_version>`
#   - if version is NOT prerelease also with:
#     - `latest`
#     - `v<major>` and `v<major>.<minor>`
#
#
# # Google Artifact Registry
#
# Depending on your setup, you might also need to run a command like
# this (replace `$…` with your values):
#
# ```sh
# gcloud iam service-accounts add-iam-policy-binding \
#   "$GOOGLE_SERVICE_ACCOUNT" \
#   --project="$GOOGLE_PROJECT_NAME" \
#   --role=roles/iam.workloadIdentityUser \
#   --member="principalSet://iam.googleapis.com/projects/$PROJECT_ID/locations/global/workloadIdentityPools/github/attribute.repository/$REPO_ORG/$REPO_NAME"
# ```
name: Docker Build and Push
on:
  workflow_call:
    secrets:
      BUILD_ARGS:
        description: >
          Build arguments for Docker build
          (multiline string)
      SLACK_BOT_TOKEN:
        description: >
          Slack bot token.
          Required, when `slack-channel-id` is set.

    inputs:
      dry-run:
        description: >
          Dry run mode
          (no pushing to registries)
        type: boolean
        default: false
      platforms:
        description: >
          Platforms to build for,
          e.g. linux/amd64,linux/arm64
        type: string
        default: 'linux/amd64'
      docker-context:
        description: >
          Docker build context
        type: string
        default: '.'
      docker-file:
        description: >
          Path to Dockerfile
        type: string
        default: 'Dockerfile'
      slack-channel-id:
        description: >
          Slack channel ID, to notify of successful run.
          Leave empty to disable.
        type: string
        default: ''
      mutable-tags:
        description: >
          Whether to update mutable tags
          (`edge`, `latest`, `v<major>`, `v<major>.<minor>`)
          on new version releases.
        type: boolean
        default: true
      github:
        description: >
          Enable pushing to GitHub Container Registry
        type: boolean
        default: false
      github-image-name:
        description: >
          GitHub Container Registry image name.
          Leave empty to use repository name.
        type: string
        default: ''
      google:
        description: >
          Enable pushing to Google Artifact Registry
        type: boolean
        default: false
      google-project:
        description: >
          Google Artifact Registry Google Cloud project ID.
          Required, if `google` is enabled.
        type: string
        default: ''
      google-registry-location:
        description: >
          Google Artifact Registry location.
          Required, if `google` is enabled.
        type: string
        default: ''
      google-repository:
        description: >
          Google Artifact Registry repository name.
          Required, if `google` is enabled.
        type: string
        default: ''
      google-workload-identity-provider:
        description: >
          Google Artifact Registry Workload Identity Provider.
          Required, if `google` is enabled.
        type: string
        default: ''
      google-service-account:
        description: >
          Google Artifact Registry Service Account email.
          Required, if `google` is enabled.
        type: string
        default: ''
      google-image-name:
        description: >
          Google Artifact Registry image name.
          Leave empty to use repository name.
        type: string
        default: ''
      amazon:
        description: >
          Enable pushing to Amazon Elastic Container Registry
        type: boolean
        default: false
      amazon-aws-account-id:
        description: >
          Amazon Elastic Container Registry AWS account ID.
          Required, if `amazon` is enabled.
        type: string
        default: ''
      amazon-aws-region:
        description: >
          Amazon Elastic Container Registry AWS region.
          Required, if `amazon` is enabled.
        type: string
        default: ''
      amazon-role-to-assume:
        description: >
          Amazon Elastic Container Registry role to assume.
          Required, if `amazon` is enabled.
        type: string
        default: ''
      amazon-image-name:
        description: >
          Amazon Elastic Container Registry image name.
          Leave empty to use repository name.
        type: string
        default: ''

jobs:
  build-push:
    name: 'Docker Build and Push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v5

      - name: 'GitHub Container Registry: Setup'
        id: github
        run: |
          if [ "${{ inputs.github && 'true' }}" != "true" ]
          then
            echo "enabled=false" | tee -a "$GITHUB_OUTPUT"
          else
            missing_inputs=''
            missing_secrets=''

            [ -n "${{ secrets.GITHUB_TOKEN }}" ] || missing_secrets="$missing_secrets GITHUB_TOKEN"

            if [ -n "$missing_inputs$missing_secrets" ]
            then
              echo "::error::Missing required inputs ($missing_inputs) or secrets ($missing_secrets)." >&2
              exit 64 # EX_USAGE
            fi

            # ghcr.io/:ORGANISATION/:IMAGE_NAME

            registry="ghcr.io/${{ github.repository_owner }}"
            echo "registry=$registry" | tee -a "$GITHUB_OUTPUT"

            image_name="${{ inputs.github-image-name }}"
            if [ -z "$image_name" ]
            then
              image_name="${{ github.event.repository.name }}"
            fi
            echo "image-name=$image_name" | tee -a "$GITHUB_OUTPUT"

            echo "enabled=true" | tee -a "$GITHUB_OUTPUT"
          fi

      - name: 'GitHub Container Registry: Authenticate'
        if: steps.github.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Google Artifact Registry: Setup'
        id: google
        run: |
          if [ "${{ inputs.google && 'true' }}" != "true" ]
          then
            echo "enabled=false" | tee -a "$GITHUB_OUTPUT"
          else
            missing_inputs=''
            missing_secrets=''

            [ -n "${{ inputs.google-project }}" ] || missing_inputs="$missing_inputs google-project"
            [ -n "${{ inputs.google-registry-location }}" ] || missing_inputs="$missing_inputs google-registry-location"
            [ -n "${{ inputs.google-repository }}" ] || missing_inputs="$missing_inputs google-repository"

            [ -n "${{ inputs.google-workload-identity-provider }}" ] || missing_inputs="$missing_inputs google-workload-identity_provider"
            [ -n "${{ inputs.google-service-account }}" ] || missing_inputs="$missing_inputs google-service-account"

            if [ -n "$missing_inputs$missing_secrets" ]
            then
              echo "::error::Missing required vars ($missing_inputs) or secrets ($missing_secrets)." >&2
              exit 64 # EX_USAGE
            fi

            # :LOCATION-docker.pkg.dev/:PROJECT/:REPOSITORY/:IMAGE_NAME

            registry="${{ inputs.google-registry-location }}-docker.pkg.dev/${{ inputs.google-project }}/${{ inputs.google-repository }}"
            echo "registry=$registry" | tee -a "$GITHUB_OUTPUT"

            image_name="${{ inputs.google-image-name }}"
            if [ -z "$image_name" ]
            then
              image_name="${{ github.event.repository.name }}"
            fi
            echo "image-name=$image_name" | tee -a "$GITHUB_OUTPUT"

            echo "enabled=true" | tee -a "$GITHUB_OUTPUT"
          fi

      - name: 'Google Artifact Registry: Authenticate to Google Cloud'
        if: steps.google.outputs.enabled == 'true'
        id: google_auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          project_id: ${{ inputs.google-project }}
          workload_identity_provider: ${{ inputs.google-workload-identity-provider }}
          service_account: ${{ inputs.google-service-account }}

      - name: 'Google Artifact Registry: Authenticate to Google Artifact Registry'
        if: steps.google.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.google.outputs.registry }}
          username: oauth2accesstoken
          password: ${{ steps.google_auth.outputs.access_token }}

      - name: 'Amazon Elastic Container Registry: Setup'
        id: amazon
        run: |
          if [ "${{ inputs.amazon && 'true' }}" != "true" ]
          then
            echo "enabled=false" | tee -a "$GITHUB_OUTPUT"
          else
            missing_inputs=''
            missing_secrets=''

            [ -n "${{ inputs.amazon-aws-account-id }}" ] || missing_inputs="$missing_inputs amazon-aws-account-id"
            [ -n "${{ inputs.amazon-aws-region }}" ] || missing_inputs="$missing_inputs amazon-aws-region"
            [ -n "${{ inputs.amazon-role-to-assume }}" ] || missing_inputs="$missing_inputs amazon-role-to-assume"

            if [ -n "$missing_inputs$missing_secrets" ]
            then
              echo "::error::Missing required vars ($missing_inputs) or secrets ($missing_secrets)." >&2
              exit 64 # EX_USAGE
            fi

            # :AWS_ACCOUNT_ID.dkr.ecr.:REGION.amazonaws.com/:IMAGE_NAME

            registry="${{ inputs.amazon-aws-account-id }}.dkr.ecr.${{ inputs.amazon-aws-region }}.amazonaws.com"
            echo "registry=$registry" | tee -a "$GITHUB_OUTPUT"

            image_name="${{ inputs.amazon-image-name }}"
            if [ -z "$image_name" ]
            then
              image_name="${{ github.event.repository.name }}"
            fi
            echo "image-name=$image_name" | tee -a "$GITHUB_OUTPUT"

            echo "enabled=true" | tee -a "$GITHUB_OUTPUT"
          fi

      - name: 'Amazon Elastic Container Registry: Configure AWS credentials'
        if: steps.amazon.outputs.enabled == 'true'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ inputs.amazon-aws-region }}
          role-to-assume: ${{ inputs.amazon-role-to-assume }}

      - name: 'Amazon Elastic Container Registry: Authenticate to Amazon Elastic Container Registry'
        if: steps.amazon.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.amazon.outputs.registry }}

      - name: 'Verify setup'
        run: |
          if [ "${{ steps.github.outputs.enabled }}" != "true" ] && \
             [ "${{ steps.google.outputs.enabled }}" != "true" ] && \
             [ "${{ steps.amazon.outputs.enabled }}" != "true" ]
          then
            echo "::error::No container registry is enabled for pushing." >&2
            exit 64 # EX_USAGE
          fi

      - name: 'Determine platforms and tags to use'
        id: config
        run: |
          platforms="${{ inputs.platforms }}"
          echo "platforms=$platforms" | tee -a "$GITHUB_OUTPUT"
          {
            echo '## Platforms'
            echo
            echo "$platforms" | tr ',' '\n' | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

          # `git-<SHORT_SHA>`
          TAGS="git-$( git rev-parse --short HEAD )"

          if [ "${{ inputs.mutable-tags }}" != "false" ]
          then
            # `edge`, if HEAD points at main branch
            # Note: Even might’ve been triggered by a tag push.
            git fetch origin main --depth=1
            if [ "$( git rev-parse HEAD )" = "$( git rev-parse origin/main )" ]
            then
              TAGS="$TAGS edge"
            fi
          fi

          # `latest` and version tags
          # Note: This is a glob, not a regular rexpression, so [0-9]*
          # acts as /[0-9].*/ in regex. This might match more than
          # intended, but it’s a trade–off not to complicate things.
          version_glob="v[0-9]*.[0-9]*.[0-9]*"
          VERSION_TAG="$(
            git describe --tags --abbrev=0 --exact --match="$version_glob" 2>/dev/null || :
          )"
          if [ -n "$VERSION_TAG" ]
          then
            TAGS="$TAGS ${VERSION_TAG}"
            # not a pre-release
            if ! echo "$VERSION_TAG" | grep -q '-'
            then
              if [ "${{ inputs.mutable-tags }}" != "false" ]
              then
                TAGS="$TAGS $( echo "${VERSION_TAG}" | grep -oE '^v[0-9]+\.[0-9]+' )"
                TAGS="$TAGS $( echo "${VERSION_TAG}" | grep -oE '^v[0-9]+' )"
                TAGS="$TAGS latest"
              fi
              echo 'new-version=true' | tee -a "$GITHUB_OUTPUT"
            fi
          fi

          TAGS="$( echo "$TAGS" | tr ' ' '\n' )"

          {
            echo "## Tags"
            echo
            # shellcheck disable=SC2001,SC2016
            echo "$TAGS" | sed 's/.*/- `&`/'
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          URLS="$(
            # GitHub Container Registry
            if [ "${{ steps.github.outputs.enabled }}" == "true" ]
            then
              echo "${{ steps.github.outputs.registry }}/${{ steps.github.outputs.image-name }}"
            fi

            # Google Artifact Registry
            if [ "${{ steps.google.outputs.enabled }}" == "true" ]
            then
              echo "${{ steps.google.outputs.registry }}/${{ steps.google.outputs.image-name }}"
            fi

            # Amazon ECR
            if [ "${{ steps.amazon.outputs.enabled }}" == "true" ]
            then
              echo "${{ steps.amazon.outputs.registry }}/${{ steps.amazon.outputs.image-name }}"
            fi
          )"

          {
            echo "## Registries"
            echo
            # shellcheck disable=SC2001
            echo "$URLS" | sed 's|^|- https://|'
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "tags<<EOF"
            for tag in $TAGS
            do
              for url in $URLS
              do
                if [ -n "$url" ]
                then
                  echo "${url}:${tag}"
                fi
              done
            done
            echo "EOF"
          } | tee -a "$GITHUB_OUTPUT"

      - name: 'Set up QEMU'
        uses: docker/setup-qemu-action@v3

      - name: 'Set up Docker Buildx'
        uses: docker/setup-buildx-action@v3

      - name: 'Build and Push'
        uses: docker/build-push-action@v6
        with:
          push: ${{ inputs.dry-run != true }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: ${{ inputs.docker-context }}
          file: ${{ inputs.docker-file }}
          platforms: ${{ steps.config.outputs.platforms }}
          provenance: true
          tags: ${{ steps.config.outputs.tags }}
          build-args: ${{ secrets.BUILD_ARGS }}

      - name: Notify
        if: >
          steps.config.outputs.new-version == 'true'
          && inputs.dry-run != true
          && inputs.slack-channel-id
        uses: verkstedt/actions/notify-status@v1
        with:
          status: success
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ inputs.slack-channel-id }}
