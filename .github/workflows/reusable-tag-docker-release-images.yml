name: Reusable Tag Docker Release Images
on:
  workflow_call:
    inputs:
      release_id:
        description: "The ID of the release"
        required: true
        type: string

jobs:
  docker-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Get Release Details
        id: release_details
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        uses: actions/github-script@v7
        with:
          script: |
            let releaseId = process.env.RELEASE_ID;

            // If release_id is 'latest', fetch the actual latest release ID
            if (releaseId === 'latest') {
              const latestRelease = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              releaseId = latestRelease.data.id.toString();
            }

            const release = await github.rest.repos.getRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId
            });

            // Get commit SHA directly from the tag reference
            const tagRef = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `tags/${release.data.tag_name}`
            });

            // For annotated tags, we need to resolve one more level
            let commitSha = tagRef.data.object.sha;
            if (tagRef.data.object.type === 'tag') {
              const tag = await github.rest.git.getTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_sha: commitSha
              });
              commitSha = tag.data.object.sha;
            }

            const shortSha = commitSha.substring(0, 7);
            core.setOutput('source_tag', shortSha);

            // Extract version without 'v' prefix
            const version = release.data.tag_name.replace('v', '');

            // Create semantic version parts
            const [major, minor, patch] = version.split('.');
            const versionTags = [
              release.data.tag_name,         // Original tag (vX.Y.Z)
              version,                  // X.Y.Z
              `${major}.${minor}`,      // X.Y
              major                     // X
            ];

            core.setOutput('version_tags', versionTags.join(','));

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Docker Image
        env:
          SHORT_SHA: ${{ steps.release_details.outputs.source_tag }}
          VERSION_TAGS: ${{ steps.release_details.outputs.version_tags }}
        run: |
          # Create all semantic version tags
          for TAG in ${VERSION_TAGS//,/ }; do
            docker buildx imagetools create \
              -t ghcr.io/${{ github.repository }}:${TAG} \
              ghcr.io/${{ github.repository }}:sha-${SHORT_SHA}
          done