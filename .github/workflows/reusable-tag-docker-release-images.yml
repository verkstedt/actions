name: Reusable Tag Docker Release Images
on:
  workflow_call:
    inputs:
      release_id:
        description: 'The ID of the release'
        required: true
        type: string

jobs:
  docker-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Get Release Details
        id: release_details
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        uses: actions/github-script@v8
        with:
          script: |
            let releaseId = process.env.RELEASE_ID;

            // If release_id is 'latest', fetch the actual latest release ID
            if (releaseId === 'latest') {
              const latestRelease = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              releaseId = latestRelease.data.id.toString();
            }

            const release = await github.rest.repos.getRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId
            });

            // Get commit SHA directly from the tag reference
            const tagRef = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `tags/${release.data.tag_name}`
            });

            // For annotated tags, we need to resolve one more level
            let commitSha = tagRef.data.object.sha;
            if (tagRef.data.object.type === 'tag') {
              const tag = await github.rest.git.getTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_sha: commitSha
              });
              commitSha = tag.data.object.sha;
            }

            const shortSha = commitSha.substring(0, 7);
            core.setOutput('source_tag', shortSha);

            // Extract version without 'v' prefix
            const version = release.data.tag_name.replace(/^v/, '');
            const isPreRelease = version.includes('-');

            // Create semantic version parts
            const [major, minor] = version.split('.');
            const versionTags = [
              release.data.tag_name,    // Original tag (vX.Y.Z[-pre][+build])
              version,                  // X.Y.Z[-pre][+build]
              `${major}.${minor}`,      // X.Y
              major                     // X
            ];
            if (!isPreRelease) {
              versionTags.push('latest')
            }

            core.setOutput('version_tags', versionTags.join(','));

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Docker Image
        env:
          SHORT_SHA: ${{ steps.release_details.outputs.source_tag }}
          VERSION_TAGS: ${{ steps.release_details.outputs.version_tags }}
        run: |
          # Create all semantic version tags
          # shellcheck disable=SC2086
          for TAG in ${VERSION_TAGS//,/ }; do
            docker buildx imagetools create \
              -t ghcr.io/${{ github.repository }}:${TAG} \
              ghcr.io/${{ github.repository }}:sha-${SHORT_SHA}
          done
    outputs:
      version_tags: ${{ steps.release_details.outputs.version_tags }}

  push_gar:
    needs: docker-tag
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_GCP_PUSH == 'true' }}

    permissions:
      contents: 'read'
      packages: 'read'
      id-token: 'write'

    env:
      GOOGLE_ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.GOOGLE_ARTIFACT_REGISTRY_REPOSITORY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate to Google Cloud
        id: google_auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          project_id: ${{ secrets.GOOGLE_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}

      - name: Login to GAR
        uses: docker/login-action@v3
        with:
          registry: europe-west3-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.google_auth.outputs.access_token }}

      - name: Push image to GAR
        env:
          VERSION_TAGS: ${{ needs.docker-tag.outputs.version_tags }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          # push all semantic version tags
          # shellcheck disable=SC2086
          for TAG in ${VERSION_TAGS//,/ }; do
            docker buildx imagetools create \
              --tag ${{ env.GOOGLE_ARTIFACT_REGISTRY_REPOSITORY }}:${TAG} \
              "ghcr.io/${{ github.repository }}:${TAG}"
          done
