name: 'Docker Build and Push: Setup Amazon Elastic Container Registry'
on:
  workflow_call:
    inputs:
      aws-account-id:
        description: >
          AWS account ID.
        type: string
        required: true
      aws-region:
        description: >
          AWS region.
        type: string
        required: true
      role-to-assume:
        description: >
          Role to assume.
        type: string
        required: true
      image-name:
        description: >
          Image name.
          Leave empty to use repository name.
        type: string
        default: ''

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.setup.outputs.registry }}
      image-name: ${{ steps.setup.outputs.image-name }}
      url: ${{ steps.setup.outputs.url }}
    steps:
      - name: 'Validate inputs'
        id: setup
        run: |
          registry="${{ inputs.aws-account-id }}.dkr.ecr.${{ inputs.aws-region }}.amazonaws.com"
          echo "registry=$registry" | tee -a "$GITHUB_OUTPUT"

          image_name="${{ inputs.image-name }}"
          if [ -z "$image_name" ]
          then
            image_name="${{ github.event.repository.name }}"
          fi
          echo "image-name=$image_name" | tee -a "$GITHUB_OUTPUT"

          echo "enabled=true" | tee -a "$GITHUB_OUTPUT"

          echo "url=${registry}/$image_name" | tee -a "$GITHUB_OUTPUT"

      - name: 'Configure AWS credentials'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ inputs.aws-region }}
          role-to-assume: ${{ inputs.role-to-assume }}

      - name: 'Authenticate to Amazon Elastic Container Registry'
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.setup.outputs.registry }}
