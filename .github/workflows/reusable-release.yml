name: Reusable Create Release
on:
  workflow_call:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0). If empty, will auto-increment patch version.'
        required: false
        type: string
    outputs:
      version:
        description: 'The version that was released'
        value: ${{ jobs.release.outputs.version }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Get Commit Details
        id: commit_details
        run: |
          COMMIT=$(git rev-parse HEAD)
          echo "commit=${COMMIT}" >> "$GITHUB_OUTPUT"

      - name: Determine Version
        id: version
        uses: actions/github-script@v8
        with:
          script: |
            // If version was provided in input, use that
            if (context.payload.inputs.version) {
              core.setOutput('version', context.payload.inputs.version);
              return;
            }

            // Otherwise calculate next version
            try {
              const { data: latestRelease } = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo
              });

              // Remove 'v' prefix if present
              const currentVersion = latestRelease.tag_name.replace('v', '');
              const [major, minor, patch] = currentVersion.split('.').map(Number);

              // Increment patch version
              const nextVersion = `${major}.${minor + 1}.0`;
              core.setOutput('version', nextVersion);
            } catch (error) {
              // If no releases exist, start with 0.1.0
              core.setOutput('version', '0.1.0');
            }

      - name: Generate Notes and Create Release
        uses: actions/github-script@v8
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ steps.commit_details.outputs.commit }}
        with:
          script: |
            const version = process.env.VERSION;
            const commit = process.env.COMMIT;

            // Generate release notes
            const { data: notes } = await github.rest.repos.generateReleaseNotes({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${version}`
            });

            // Create release pointing to the specific commit
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${version}`,
              name: `v${version}`,
              body: notes.body,
              draft: true,
              prerelease: false,
              target_commitish: commit
            });
