name: 'Reusable gcp cloudrun deploy workflow'

on:
  workflow_call:
    inputs:
      job-name:
        required: false
        type: string
      service-name:
        required: false
        type: string
      registry:
        required: true
        type: string
      artifact-repository:
        required: true
        type: string
      artifact-tag:
        required: true
        type: string
      region:
        required: true
        type: string
      flags:
        type: string
      container:
        type: string
      workload-identity-provider:
        required: true
        type: string
      workload-identity-service-account-mail:
        required: true
        type: string
jobs:
  deploy_cloudrun:
    name: Deployment job
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate inputs
        run: |
          if [[ -z "${{ inputs.job-name }}" && -z "${{ inputs.service-name }}" ]]; then
            echo "Error: at least one of 'job-name' or 'service-name' must be provided"
            exit 1
          fi
      - uses: 'google-github-actions/auth@v3'
        with:
          service_account: ${{ inputs.workload-identity-service-account-mail }}
          workload_identity_provider: ${{ inputs.workload-identity-provider }}
      - name: 'Set up gcloud CLI'
        uses: 'google-github-actions/setup-gcloud@v3'
        with:
          version: '>= 363.0.0'
      - name: 'Prepare deployment flags'
        id: flags
        run: |
          if [ -n "${{ inputs.container }}" ]; then
            echo "container_flag=--container ${{ inputs.container }}" >> "$GITHUB_OUTPUT"
          else
            echo "container_flag=" >> "$GITHUB_OUTPUT"
          fi
      - name: 'deploy cloudrun'
        run: |
          IMAGE="${{ inputs.registry }}/${{ inputs.artifact-repository }}:${{ inputs.artifact-tag }}"
          CONTAINER_FLAG="${{ steps.flags.outputs.container_flag }}"
          EXTRA_FLAGS="${{ inputs.flags }}"
          
          if [ -n "${{ inputs.job-name }}" ]; then
            NAME="${{ inputs.job-name }}"
            CMD="gcloud run jobs deploy"
          else
            NAME="${{ inputs.service-name }}"
            CMD="gcloud run deploy"
          fi
          
          $CMD "$NAME" \
            ${CONTAINER_FLAG} --image="$IMAGE" --region="${{ inputs.region }}" ${EXTRA_FLAGS}