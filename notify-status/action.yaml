name: Send job status notification
description: "Sends Slack message. Most commonly used with `if: failure() && github.ref == 'refs/heads/main'`"

inputs:
  status:
    description: 'Status to show. One of: success, failure, cancelled'
    required: true
  slack-bot-token:
    description: 'Slack bot token. Go to https://api.slack.com/apps/, create a bot, go to “OAuth & Permissions”. Add chat:write permission and grab a token.'
    required: true
  slack-channel-id:
    description: 'This is _not_ a channel name. You can grab the ID from page URL.'
    required: true
  text:
    description: 'Optional custom text to include in the message.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Compose message
      id: message
      env:
        MESSAGE: >
          ${{
            format(
              '*{1}* {2}: {3} @ {4}{0}{0}{5}',
              fromJson('"\n"'),
              inputs.status == 'failure' && '🔴 FAILED' || inputs.status == 'success' && '🟢' || '🟡',
              github.workflow,
              github.repository,
              github.head_ref || github.ref_name,
              inputs.text
            )
          }}
      shell: bash
      run: |
        # The message goes into a single Block Kit section block, whose
        # text holds at most 3000 characters (`<!here> ` included), per
        # https://docs.slack.dev/reference/block-kit/blocks/section-block
        # Truncate, rather than have Slack reject the whole message and
        # leave us with no notification at all.
        max=2900
        marker='… (truncated)'
        if [ "${#MESSAGE}" -gt "$max" ]; then
          MESSAGE="${MESSAGE:0:$(( max - ${#marker} - 1 ))}"
          # Back off to a line boundary, so a `<url|label>` link is not
          # cut in half and rendered as plain text.
          MESSAGE="${MESSAGE%$'\n'*}"
          MESSAGE="${MESSAGE}"$'\n'"${marker}"
          echo "::warning::Slack message truncated to fit a Block Kit section block"
        fi
        printf "value<<EOM\n%s\nEOM\n" "$MESSAGE" | tee -a "$GITHUB_OUTPUT"
    - name: Send Slack message
      uses: slackapi/slack-github-action@v3.0.3
      with:
        method: chat.postMessage
        token: ${{ inputs.slack-bot-token }}
        # TIP: Use
        # https://app.slack.com/block-kit-builder/ to preview
        payload: |
          {
            "channel": "${{ inputs.slack-channel-id }}",
            "text": ${{ toJson(steps.message.outputs.value) }},
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": ${{ toJson(format('<!here> {0}', steps.message.outputs.value)) }}
                }
              },
              {
                "type": "context",
                "elements": [
                  {
                    "type": "mrkdwn",
                    "text": "Triggered by:"
                  },
                  {
                    "type": "image",
                    "alt_text": "",
                    "image_url": "${{ github.event.sender.avatar_url }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "<${{ github.event.sender.html_url }}|${{ github.event.sender.login }}>"
                  }
              ]
              },
              {
                "type": "context",
                "elements": [
                  {
                    "type": "mrkdwn",
                    "text": ${{
                      toJson(format(
                        '*Logs:* <{0}/{1}/actions/runs/{2}|GH Actions>',
                        github.server_url,
                        github.repository,
                        github.run_id
                      ))
                    }}
                  }
                ]
              }
            ]
          }
