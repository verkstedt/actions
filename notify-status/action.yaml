name: Send job status notification
description: "Sends Slack message. Most commonly used with `if: failure() && github.ref == 'refs/heads/main'`"

inputs:
  status:
    description: 'Status to show. One of: success, failure, cancelled'
    required: true
  slack-bot-token:
    description: 'Slack bot token. Go to https://api.slack.com/apps/, create a bot, go to “OAuth & Permissions”. Add chat:write permission and grab a token.'
    required: true
  slack-channel-id:
    description: 'This is _not_ a channel name. You can grab the ID from page URL.'
    required: true
  text:
    description: 'Optional custom text to include in the message.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Send Slack message
      uses: slackapi/slack-github-action@v1
      env:
        SLACK_BOT_TOKEN: ${{ inputs.slack-bot-token }}
      with:
        channel-id: ${{ inputs.slack-channel-id }}
        # TIP: Use
        # https://app.slack.com/block-kit-builder/ to preview
        payload: |
          {
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": ${{
                    toJson(format(
                      '<!here> *{1}* {2}: {3} @ {4}{0}{0}{5}',
                      fromJson('"\n"'),
                      inputs.status == 'failure' && '🔴 FAILED' || inputs.status == 'success' && '🟢' || '🟡',
                      github.workflow,
                      github.repository,
                      github.head_ref || github.ref_name,
                      inputs.text
                    ))
                  }}
                }
              },
              {
                "type": "context",
                "elements": [
                  {
                    "type": "mrkdwn",
                    "text": "Triggered by:"
                  },
                  {
                    "type": "image",
                    "alt_text": "",
                    "image_url": "${{ github.event.sender.avatar_url }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "<${{ github.event.sender.html_url }}|${{ github.event.sender.login }}>"
                  }
              ]
              },
              {
                "type": "context",
                "elements": [
                  {
                    "type": "mrkdwn",
                    "text": ${{
                      toJson(format(
                        '*Logs:* <{0}/{1}/actions/runs/{2}|GH Actions>',
                        github.server_url,
                        github.repository,
                        github.run_id
                      ))
                    }}
                  }
                ]
              }
            ]
          }
