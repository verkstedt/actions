name: Send job status notification
description: "Sends Slack message. Most commonly used with `if: failure() && github.ref == 'refs/heads/main'`"

inputs:
  status:
    description: 'Status to show. One of: success, failure, cancelled'
    required: true
  slack-bot-token:
    description: 'Slack bot token. Go to https://api.slack.com/apps/, create a bot, go to “OAuth & Permissions”. Add chate:write permission and grab a token.'
    required: true
  slack-channel-id:
    description: 'This is _not_ a channel name. You can grab the ID from page URL.'
    required: true

runs:
  using: composite
  steps:
    - name: Send Slack message
      uses: slackapi/slack-github-action@v1
      env:
        SLACK_BOT_TOKEN: ${{ inputs.slack-bot-token }}
      with:
        channel-id: ${{ inputs.slack-channel-id }}
        # TIP: Use
        # https://app.slack.com/block-kit-builder/ to preview
        payload: |
          {
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "<!here> *${{ inputs.status == 'failure' && '🔴 FAILED' || inputs.status == 'success' && '🟢' || '🟡' }}* ${{ github.workflow }}: ${{ github.repository }} @ ${{ github.head_ref || github.ref_name }}"
                }
              },
              {
                "type": "context",
                "elements": [
                  {
                    "type": "mrkdwn",
                    "text": "Triggered by:"
                  },
                  {
                    "type": "image",
                    "alt_text": "",
                    "image_url": "${{ github.event.sender.avatar_url }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "<${{ github.event.sender.html_url }}|${{ github.event.sender.login }}>"
                  }
              ]
              },
              {
                "type": "context",
                "elements": [
                  {
                    "type": "mrkdwn",
                    "text": "*Logs:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|GH Actions>"
                  }
                ]
              }
            ]
          }
